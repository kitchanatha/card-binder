<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Card Binder</title>
<meta name="description" content="Browse every Pokémon and ONE PIECE card in every set, in English and Japanese, with prices, rarity and pull odds. Track your collection.">
<!-- installable app (PWA) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151413" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Card Binder">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --surface-2: #efede8; --text: #1d1c1a; --muted: #6b675f;
    --border: #e2dfd8; --accent: #c2410c; --accent-soft: #fde8dc; --ok: #15803d; --ok-soft: #dcfce7;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151413; --surface: #1f1e1c; --surface-2: #2a2926; --text: #f1efe9; --muted: #a29d93;
      --border: #34322e; --accent: #fb923c; --accent-soft: #3b2417; --ok: #4ade80; --ok-soft: #14301f;
      --shadow: 0 1px 2px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; }
  button, input { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }

  header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding-top: env(safe-area-inset-top, 0px); }
  .bar { max-width: 1200px; margin: 0 auto; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 12px; }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
  .brand span { color: var(--accent); }
  .spacer { flex: 1; }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: transparent; padding: 4px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

  main { max-width: 1200px; margin: 0 auto; padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .crumbs { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .crumbs a:hover { color: var(--accent); }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 0 0 18px; }

  .games { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .game { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); transition: transform .15s; }
  .game:hover { transform: translateY(-2px); border-color: var(--accent); }
  /* original game icons (inline SVG): a two-tone ball for Pokémon, a straw hat for ONE PIECE */
  .gicon { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 14px; background: var(--surface-2); }
  .gicon svg { width: 40px; height: 40px; display: block; }
  .gicon.sm { width: 38px; height: 38px; border-radius: 10px; flex: 0 0 auto; }
  .gicon.sm svg { width: 28px; height: 28px; }
  .gtitle { display: flex; align-items: center; gap: 12px; }
  .game:hover .gicon svg { transform: rotate(-8deg) scale(1.06); }
  @media (prefers-reduced-motion: no-preference) { .gicon svg { transition: transform .2s ease; } }
  .game h2 { margin: 8px 0 4px; font-size: 20px; }
  .game p { margin: 0; color: var(--muted); font-size: 14px; }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .search { flex: 1; min-width: 200px; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); }
  .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }

  .sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .set { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
  .set:hover { border-color: var(--accent); }
  .set .logo { height: 48px; display: flex; align-items: center; }
  .set .logo img { max-height: 48px; max-width: 100%; object-fit: contain; }
  .set .code { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .03em; }
  .set .name { font-weight: 600; line-height: 1.3; }
  .set .meta { font-size: 12px; color: var(--muted); margin-top: auto; }
  .progress { height: 5px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--ok); }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .card { position: relative; background: transparent; border: 0; padding: 0; cursor: pointer; text-align: left; }
  .rar { position: absolute; left: 6px; bottom: 6px; font-size: 10px; font-weight: 800; letter-spacing: .03em; color: #fff;
    padding: 2px 6px; border-radius: 4px; background: #6b7280; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
  .t1 { background: #2563eb; } .t2 { background: #7c3aed; } .t3 { background: #d97706; }
  .t4 { background: linear-gradient(135deg, #db2777, #f59e0b); }
  .rchips { display: flex; flex-wrap: wrap; gap: 6px; margin: -6px 0 16px; }
  .rchips:empty { display: none; }
  .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #6b7280; }
  .chip .dot.t1 { background: #2563eb; } .chip .dot.t2 { background: #7c3aed; } .chip .dot.t3 { background: #d97706; }
  .chip .dot.t4 { background: linear-gradient(135deg, #db2777, #f59e0b); }
  .chip .n { color: var(--muted); font-weight: 400; margin-left: 5px; }
  .odds { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; margin: 0 0 12px; font-size: 13px; }
  .odds span { font-size: 12px; color: var(--muted); }
  .odds strong { display: block; font-size: 20px; color: var(--accent); margin: 2px 0 4px; }
  .odds small { display: block; color: var(--muted); margin-top: 6px; font-size: 11px; }
  /* booster pack art: on the right of each set tile, and beside the title on a set page */
  .set { position: relative; }
  .set.has-pack { padding-right: 88px; }
  .packimg { position: absolute; right: 12px; top: 12px; width: 64px; height: calc(100% - 24px); max-height: 120px;
    object-fit: contain; object-position: top center; filter: drop-shadow(0 2px 4px rgba(0,0,0,.18)); }
  .sethead { display: flex; gap: 16px; align-items: center; margin-bottom: 20px; }
  .sethead .sub { margin-bottom: 0; }
  .sethead > div { min-width: 0; }
  .packhero { width: 84px; max-height: 150px; object-fit: contain; flex: 0 0 auto; filter: drop-shadow(0 4px 10px rgba(0,0,0,.2)); }
  @media (max-width: 640px) { .packhero { width: 64px; } }
  .collbtn { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px;
    font-weight: 600; cursor: pointer; color: var(--text); }
  .collbtn:hover, .collbtn:focus-visible { border-color: var(--accent); color: var(--accent); }
  @media (max-width: 480px) { .collbtn span { display: none; } }
  .coll { max-width: 520px; }
  .collin { padding: 24px; display: grid; gap: 14px; }
  .collin h2 { margin: 0; font-size: 22px; }
  .collin h3 { margin: 0 0 4px; font-size: 15px; }
  .collin section { border-top: 1px solid var(--border); padding-top: 14px; }
  .muted { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .colltable { border-collapse: collapse; font-variant-numeric: tabular-nums; width: 100%; max-width: 320px; }
  .colltable th, .colltable td { padding: 4px 10px 4px 0; text-align: left; font-size: 14px; }
  .colltable thead th { color: var(--muted); font-size: 12px; font-weight: 600; }
  .colltable td { font-weight: 700; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .collmsg { margin: 8px 0 0; font-size: 13px; color: var(--ok); }
  /* ---------- pack opening simulator (always dark, like a stage) ---------- */
  .simrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: -6px 0 20px; }
  .simrow .muted { margin: 0; }
  .simbtn { background: var(--accent); border-color: var(--accent); color: #fff; }
  .simbtn:hover, .simbtn:focus-visible { filter: brightness(1.08); }
  .packsim { width: 100vw; height: 100dvh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; border-radius: 0;
    background: radial-gradient(ellipse at 50% 35%, #2a2723, #0e0d0c 70%); color: #f1efe9; overflow: hidden; }
  .packsim::backdrop { background: #000; }
  .psclose { position: absolute; z-index: 3; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
    width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.12); color: #fff; font-size: 22px; cursor: pointer; }
  .psstage { position: absolute; inset: 0; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; gap: 12px; overflow: auto;
    padding: calc(56px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
  .psfoot { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px;
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .psfoot .btn { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.18); color: #f1efe9; }
  .psfoot .psmain { background: #c2410c; border-color: #c2410c; color: #fff; }
  .pshint { margin: 0; font-size: 14px; color: #c9c5bc; text-align: center; }
  .psnote { margin: 0; font-size: 12px; color: #8f8a80; text-align: center; max-width: 520px; }
  .pscount { margin: 0; font-size: 12px; letter-spacing: .08em; color: #8f8a80; font-variant-numeric: tabular-nums; }
  /* the pack: two copies of the art, clipped into a top strip and a body that come apart */
  .pspack { position: relative; width: min(240px, 60vw); aspect-ratio: 3/5; border: 0; padding: 0; background: none; cursor: pointer;
    filter: drop-shadow(0 18px 30px rgba(0,0,0,.6)); }
  .pspack > span { position: absolute; inset: 0; display: grid; place-items: center; transition: transform .55s cubic-bezier(.2,.7,.3,1), opacity .55s; }
  .pspack img { width: 100%; height: 100%; object-fit: contain; }
  .pstop { clip-path: inset(0 0 82% 0); }
  .psbody { clip-path: inset(18% 0 0 0); }
  .pspack:hover .psbody, .pspack:hover .pstop { transform: translateY(-4px); }
  .pspack.tearing .pstop { transform: translate(-30px, -120px) rotate(-14deg); opacity: 0; }
  .pspack.tearing .psbody { transform: translateY(60px) scale(.96); opacity: 0; }
  .psfake { width: 100%; height: 100%; border-radius: 10px; background: linear-gradient(160deg, #c2410c, #7c2d12); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 16px; }
  .psfake span { font-weight: 800; letter-spacing: .08em; }
  /* a card: back and front faces, flipped in 3D */
  .pscard { position: relative; width: min(300px, 68vw, 46dvh); aspect-ratio: 63/88; border: 0; padding: 0; background: none; cursor: pointer; perspective: 1200px; }
  .psinner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.2,.7,.3,1); }
  .pscard.flipped .psinner { transform: rotateY(180deg); }
  .psback, .psfront { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 14px; overflow: hidden; }
  .psback { display: grid; place-items: center; border: 7px solid #efe6d8;
    background: radial-gradient(circle, #c2410c 0 17%, transparent 18%), repeating-linear-gradient(45deg, #1b2440 0 10px, #222c4d 10px 20px); }
  .psback i { font-style: normal; font-size: 40px; color: #fff; }
  .psfront { transform: rotateY(180deg); background: #222; }
  .psfront img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .psnoimg { display: grid; place-items: center; height: 100%; padding: 12px; text-align: center; }
  .psname { margin: 0; min-height: 2.6em; text-align: center; font-weight: 700; }
  .psname small { display: block; font-weight: 400; color: #a29d93; }
  /* rarity glow once flipped: purple (RR/L), gold (IR/UR/SR/alt), rainbow (SIR/HR/SEC/manga) */
  .pscard.flipped.t2 .psfront { box-shadow: 0 0 0 3px #a78bfa, 0 0 40px 8px rgba(167,139,250,.55); }
  .pscard.flipped.t3 .psfront { box-shadow: 0 0 0 3px #fbbf24, 0 0 50px 12px rgba(251,191,36,.6); }
  .pscard.flipped.t4 .psfront { box-shadow: 0 0 0 3px #fff, 0 0 60px 16px rgba(244,114,182,.6), 0 0 110px 30px rgba(96,165,250,.45); }
  .pscard.rev .psfront::after, .pstile.rev .img::after { content: ''; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
    background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,.55) 45%, rgba(147,197,253,.5) 55%, transparent 80%); }
  .psburst { position: absolute; inset: -40%; z-index: -1; border-radius: 50%; opacity: 0; pointer-events: none;
    background: conic-gradient(from 0deg, #f472b6, #fbbf24, #34d399, #60a5fa, #a78bfa, #f472b6); filter: blur(28px); }
  .pscard.flipped .psburst { opacity: .75; }
  @media (prefers-reduced-motion: no-preference) {
    .pscard.flipped.t3, .pscard.flipped.t4 { animation: pspop .5s .45s both; }
    .pscard.flipped .psburst { animation: psspin 6s linear infinite; }
  }
  @keyframes pspop { 0% { transform: scale(1); } 40% { transform: scale(1.07); } 100% { transform: scale(1); } }
  @keyframes psspin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .psinner, .pspack > span { transition: none; } }
  /* summary */
  /* centred with auto margins (not justify-content) so tall content still scrolls to its top */
  .psstage > :first-child { margin-top: auto; } .psstage > :last-child { margin-bottom: auto; }
  .pssum { width: min(900px, 100%); display: grid; gap: 14px; align-content: start; }
  .pssum h2 { margin: 0; text-align: center; font-size: 22px; }
  .psvalue { text-align: center; display: grid; gap: 2px; }
  .psvalue span { font-size: 12px; color: #a29d93; text-transform: uppercase; letter-spacing: .06em; }
  .psvalue strong { font-size: 30px; color: #fb923c; font-variant-numeric: tabular-nums; }
  .psvalue small { color: #c9c5bc; }
  .psgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
  .pstile { border: 0; padding: 0; background: none; color: inherit; text-align: left; cursor: pointer; display: grid; gap: 3px; min-width: 0; }
  .pstile .img { position: relative; display: block; aspect-ratio: 63/88; border-radius: 7px; overflow: hidden; background: #2a2826; }
  .pstile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pstile.t2 .img { box-shadow: 0 0 0 2px #a78bfa; } .pstile.t3 .img { box-shadow: 0 0 0 2px #fbbf24; }
  .pstile.t4 .img { box-shadow: 0 0 0 2px #fff, 0 0 18px rgba(244,114,182,.7); }
  .pslabel { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .psprice { font-size: 12px; font-weight: 700; color: #fb923c; font-variant-numeric: tabular-nums; }
  .psnew { position: absolute; top: 5px; right: 5px; font-size: 9px; font-weight: 800; padding: 2px 5px; border-radius: 4px; background: #16a34a; color: #fff; }
  .cardhits { margin-top: 28px; }
  .cardhits h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }
  .cardhits h2 .n { color: var(--accent); margin-left: 4px; }
  .cardhits .card { text-decoration: none; display: block; }
  .inset { font-size: 11px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top { margin: 0 0 20px; }
  .top h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  .topwait, .topnote { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  .toprow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .tcard { display: flex; gap: 12px; align-items: center; text-align: left; cursor: pointer; min-width: 0;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px; }
  .tcard:hover, .tcard:focus-visible { border-color: var(--accent); }
  .timg { position: relative; flex: 0 0 72px; aspect-ratio: 63/88; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
  .timg img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rank { position: absolute; left: 4px; top: 4px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
    font-size: 11px; font-weight: 800; color: #fff; background: var(--accent); }
  .tinfo { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .tinfo b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tinfo small { font-size: 12px; color: var(--muted); }
  .tinfo strong { font-size: 18px; color: var(--accent); font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) {
    .toprow { gap: 8px; }
    .tcard { flex-direction: column; align-items: stretch; padding: 8px; gap: 6px; }
    .timg { flex-basis: auto; width: 100%; }
    .tinfo b { font-size: 12px; }
    .tinfo strong { font-size: 15px; }
  }
  .price { position: absolute; right: 6px; bottom: 6px; font-size: 11px; font-weight: 700; color: #fff;
    background: rgba(0,0,0,.72); padding: 2px 7px; border-radius: 4px; }
  .set .date { font-size: 12px; color: var(--muted); }
  .set .date.soon { color: var(--accent); font-weight: 600; }
  .pricebox { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin: 0 0 12px; font-size: 13px; }
  .pricebox > span { font-size: 12px; color: var(--muted); }
  .pricebox strong { display: block; font-size: 22px; margin: 2px 0 6px; }
  .prow { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; border-top: 1px dashed var(--border); }
  .prow span { color: var(--muted); }
  .pricebox .trend { font-size: 12px; font-style: normal; font-weight: 600; margin-left: 6px; color: var(--muted); }
  .pricebox .trend.up { color: var(--ok); }
  .pricebox .trend.down { color: var(--accent); }
  .pricebox .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .pricebox .links .btn { font-size: 13px; padding: 6px 12px; }
  .pricebox small { display: block; color: var(--muted); margin-top: 6px; font-size: 11px; }
  .card .img { position: relative; aspect-ratio: 63/88; border-radius: 8px; overflow: hidden; background: var(--surface-2); box-shadow: var(--shadow); transition: transform .15s; }
  .card:hover .img { transform: scale(1.03); }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .noimg { width: 100%; height: 100%; display: grid; place-items: center; color: var(--muted); font-size: 12px; padding: 8px; text-align: center; }
  .card.have .img { outline: 3px solid var(--ok); outline-offset: 2px; }
  .card .label { font-size: 12px; margin-top: 6px; display: flex; gap: 6px; align-items: baseline; }
  .card .label b { color: var(--muted); font-weight: 600; flex-shrink: 0; }
  .card .label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .own { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff;
    background: rgba(0,0,0,.35); color: #fff; display: grid; place-items: center; font-size: 15px; cursor: pointer; }
  .own[aria-pressed="true"] { background: var(--ok); }
  .badge { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.65); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }

// ---------- storage ----------
function load(k, d) { try { const v = localStorage.getItem('cb:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }
function save(k, v) { try { localStorage.setItem('cb:' + k, JSON.stringify(v)); } catch {} }
const ownedKey = (game) => `owned:${game}:${lang}`;
const getOwned = (game) => new Set(load(ownedKey(game), []));
function toggleOwned(game, id) {
  const s = getOwned(game); s.has(id) ? s.delete(id) : s.add(id);
  save(ownedKey(game), [...s]);
  // remember when each card was marked or unmarked, so syncing two devices keeps the latest change
  const stamps = load('stamps:' + ownedKey(game), {}); stamps[id] = [s.has(id), Date.now()];
  save('stamps:' + ownedKey(game), stamps);
  onCollectionChange();
  return s.has(id);
}

// ---------- collection backup / sync ----------
// A snapshot covers every game and language: { app, version, savedAt, collections: { "pokemon:en": [ids] },
// stamps: { "pokemon:en": { id: [owned, time] } } }. Export/Import and Google Drive sync all use it.
const COLLECTION_KEYS = ['pokemon:en', 'pokemon:ja', 'onepiece:en', 'onepiece:ja'];
function snapshot() {
  const collections = {}, stamps = {};
  for (const k of COLLECTION_KEYS) { collections[k] = load('owned:' + k, []); stamps[k] = load('stamps:owned:' + k, {}); }
  return { app: 'card-binder', version: 1, savedAt: new Date().toISOString(), collections, stamps };
}
// Merge another snapshot into this browser. Per card the most recent mark/unmark wins;
// a card with no history on either side is kept if either side owns it. Returns how many cards changed.
function mergeSnapshot(other) {
  if (!other || other.app !== 'card-binder' || typeof other.collections !== 'object') throw new Error('not-collection');
  let changed = 0;
  for (const k of COLLECTION_KEYS) {
    const mine = new Set(load('owned:' + k, [])), mineSt = load('stamps:owned:' + k, {});
    const theirs = new Set(Array.isArray(other.collections[k]) ? other.collections[k].filter(x => typeof x === 'string') : []);
    const theirSt = other.stamps?.[k] || {};
    const out = new Set(), st = { ...mineSt };
    for (const id of new Set([...mine, ...theirs, ...Object.keys(mineSt), ...Object.keys(theirSt)])) {
      const a = mineSt[id], b = Array.isArray(theirSt[id]) ? theirSt[id] : undefined;
      let owned;
      if (a && b) { owned = (b[1] > a[1] ? b : a)[0]; st[id] = b[1] > a[1] ? b : a; }
      else if (a || b) {
        const s = a || b, otherHas = a ? theirs.has(id) : mine.has(id);
        owned = s[0] || otherHas; st[id] = a || b;          // no history on one side: never drop a card that side owns
      } else owned = mine.has(id) || theirs.has(id);
      if (owned) out.add(id);
      if (owned !== mine.has(id)) changed++;
    }
    save('owned:' + k, [...out]); save('stamps:owned:' + k, st);
  }
  return changed;
}
let onCollectionChange = () => {};

// Card Binder see files it created itself; nothing is stored anywhere else.
// Set GOOGLE_CLIENT_ID to an OAuth client id (Google Cloud console) to show the sync option.
const GOOGLE_CLIENT_ID = '63616001931-p000i3bktjjngenoc89h05a424dv6q3b.apps.googleusercontent.com';
const DRIVE_FILE = 'card-binder-collection.json';
const drive = { token: null, exp: 0, client: null, busy: false, timer: null, status: '' };
const driveOn = () => !!load('drive:on', false);
function loadScript(src) {
  return new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.append(s); });
}
// Ask Google for an access token; shows Google's own sign-in/consent popup the first time
async function driveToken(interactive) {
  if (drive.token && Date.now() < drive.exp - 60000) return drive.token;
  if (!interactive) return null;
  if (!window.google?.accounts?.oauth2) await loadScript('https://accounts.google.com/gsi/client');
  return new Promise((resolve, reject) => {
    drive.client = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.file',
      callback: r => {
        if (r.error || !r.access_token) return reject(new Error(r.error || 'no-token'));
        drive.token = r.access_token; drive.exp = Date.now() + (r.expires_in || 3600) * 1000; resolve(drive.token);
      },
      error_callback: e => reject(new Error(e?.type || 'popup')),
    });
    drive.client.requestAccessToken({ prompt: driveOn() ? '' : 'consent' });
  });
}
async function driveFetch(url, opts = {}) {
  const r = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: `Bearer ${drive.token}` } });
  if (r.status === 401) { drive.token = null; throw new Error('expired'); }
  if (!r.ok) throw new Error(`drive ${r.status}`);
  return r;
}
// Pull the Drive copy, merge it in, push the merged result back
async function driveSync(interactive) {
  if (drive.busy) return;
  drive.busy = true; drive.status = 'syncing'; renderColl();
  try {
    if (!await driveToken(interactive)) { drive.status = 'reconnect'; return; }
    const api = 'https://www.googleapis.com/drive/v3/files', up = 'https://www.googleapis.com/upload/drive/v3/files';
    const q = encodeURIComponent(`name='${DRIVE_FILE}' and trashed=false`);
    const found = (await (await driveFetch(`${api}?q=${q}&spaces=drive&fields=files(id)`)).json()).files?.[0];
    let changed = 0;
    if (found) changed = mergeSnapshot(await (await driveFetch(`${api}/${found.id}?alt=media`)).json());
    const body = JSON.stringify(snapshot());
    if (found) await driveFetch(`${up}/${found.id}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body });
    else {
      const meta = JSON.stringify({ name: DRIVE_FILE, mimeType: 'application/json' }), b = 'cb' + Date.now();
      await driveFetch(`${up}?uploadType=multipart`, { method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${b}` },
        body: `--${b}\r\nContent-Type: application/json\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--` });
    }
    save('drive:on', true); save('drive:last', Date.now());
    drive.status = changed ? tf('syncChanged', { n: changed }) : 'ok';
    if (changed) route();   // redraw so newly synced cards show as owned
  } catch (e) {
    drive.status = e.message === 'expired' ? 'reconnect' : e.message === 'popup_failed_to_open' ? 'blocked'
      : /popup|access_denied/.test(e.message) ? 'cancelled' : 'failed';
  } finally { drive.busy = false; renderColl(); }
}
function driveDisconnect() {
  if (drive.token && window.google?.accounts?.oauth2) google.accounts.oauth2.revoke(drive.token, () => {});
  drive.token = null; save('drive:on', false); drive.status = ''; renderColl();
}
// While connected, push changes a few seconds after the last tap (no popup: skipped if the token expired)
onCollectionChange = () => {
  if (!GOOGLE_CLIENT_ID || !driveOn() || !drive.token) return;
  clearTimeout(drive.timer); drive.timer = setTimeout(() => driveSync(false), 4000);
};

// ---------- fetch with cache ----------
const cache = new Map();
async function getJSON(url) {
  if (cache.has(url)) return cache.get(url);
  const p = fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  cache.set(url, p); p.catch(() => cache.delete(url));
  return p;
}
async function postGraphQL(url, query) {
  const k = url + '#' + query;
  if (cache.has(k)) return cache.get(k);
  const p = fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query }) })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  cache.set(k, p); p.catch(() => cache.delete(k));
  return p;
}

// ---------- data adapters: each game normalises to {sets:[{id,code,name,logo,total}], cards:[{id,num,name,img,imgHi,alt}]} ----------
const TCGDEX = { en: 'en', ja: 'ja' };
const PUNK = 'https://raw.githubusercontent.com/buhbbl/punk-records/main';
const PUNK_LANG = { en: { dir: 'english', prefix: '569' }, ja: { dir: 'japanese', prefix: '550' } };
const OP_JP_EXTRA = { '550204': 'EB-04', '550701': '' }; // packs that only exist in Japanese
// Release dates + official names, scraped from the official JP/EN product pages (tools/scrape-op-sets.js)
const opOfficial = () => getJSON('op-sets.json').catch(() => ({ ja: {}, en: {} }));
// "OP14-EB04" is how the English release is labelled; Japan released OP-14 and EB-04 separately
const opJaCode = code => code.replace(/^OP(\d+)-EB\d+$/, 'OP-$1');
// Official ONE PIECE images block cross-site embedding, so route them through api/img.js
// and shrink them: the originals are ~1.7 MB print-size PNGs (w=240 grid ≈ 20 KB, w=640 detail)
// (no w = the full-size original, only fetched when someone opens the zoom viewer)
const opImg = (u, w, trim) => u ? `api/img?u=${encodeURIComponent(u)}${w ? `&w=${w}` : ''}${trim ? '&trim=1' : ''}` : null;

// TCGdex lags on images for brand-new English sets; fall back to pokemontcg.io / Scrydex.
// Match the set by release date + closest card count, then cards by name (reprint sets keep their
// original numbers there, so numbers don't line up). Returns Map(tcgdexCardId -> {small, large}).
// pokemontcg.io often answers 500/502, so retry with backoff
async function getJSONRetry(url, tries = 8) {
  for (let i = 0; i < tries; i++) {
    try { return await getJSON(url); } catch { await new Promise(r => setTimeout(r, 500 + i * 700)); }
  }
  return null;
}
async function ptcgImagesFor(s) {
  const cached = load('ptcg:' + s.id, null);
  if (cached) return new Map(Object.entries(cached));
  const out = new Map();
  if (lang !== 'en' || !s.releaseDate) return out;
  const sets = (await getJSONRetry('https://api.pokemontcg.io/v2/sets?pageSize=250&select=id,releaseDate,total'))?.data || [];
  const n = s.cards.length;
  const match = sets.filter(p => p.releaseDate.replace(/\//g, '-') === s.releaseDate)
    .sort((a, b) => Math.abs(a.total - n) - Math.abs(b.total - n))[0];
  if (!match) return out;
  const pool = (await getJSONRetry(`https://api.pokemontcg.io/v2/cards?q=set.id:${match.id}&pageSize=250&select=number,name,images`))?.data || [];
  pool.sort((a, b) => parseInt(a.number) - parseInt(b.number) || a.number.localeCompare(b.number));
  const norm = x => x.toLowerCase().replace(/[^a-z0-9]/g, '');
  const take = pred => { const i = pool.findIndex(pred); return i < 0 ? null : pool.splice(i, 1)[0]; };
  for (const c of s.cards.filter(c => !c.image)) {
    const k = norm(c.name);
    const hit = take(p => norm(p.name) === k) || take(p => norm(p.name).startsWith(k) || k.startsWith(norm(p.name)));
    if (hit?.images) out.set(c.id, hit.images);
  }
  if (out.size) save('ptcg:' + s.id, Object.fromEntries(out));
  return out;
}

// TCGdex's set endpoint has no rarity, but cards can be filtered by set + rarity:
// one small request per rarity name labels the whole set. Returns {cardId: rarity}.
async function tcgdexRarities(s) {
  const key = `rar:${lang}:${s.id}`, cached = load(key, null);
  if (cached) return cached;
  const base = `https://api.tcgdex.net/v2/${TCGDEX[lang]}`;
  const names = await getJSONRetry(`${base}/rarities`, 3) || [];
  const out = {}; let complete = names.length > 0;
  await Promise.all(names.filter(r => r !== 'None').map(r =>
    getJSONRetry(`${base}/cards?set.id=eq:${encodeURIComponent(s.id)}&rarity=eq:${encodeURIComponent(r)}`, 3)
      .then(list => { if (!list) complete = false; (list || []).forEach(c => { out[c.id] = r; }); })));
  if (complete) save(key, out);
  return out;
}

// ---------- rarity + estimated pull odds ----------
// Short code and tier (0 common … 4 chase) per rarity name; tier sets the badge colour.
const RARITY = {
  pokemon: {
    'Common': ['C', 0], 'Uncommon': ['U', 0], 'Rare': ['R', 1], 'Rare Holo': ['R', 1], 'Holo Rare': ['R', 1],
    'Double rare': ['RR', 2], 'Triple Rare': ['RRR', 2], 'ACE SPEC Rare': ['ACE', 2], 'Promo': ['PR', 1],
    'Illustration rare': [{ en: 'IR', ja: 'AR' }, 3], 'Ultra Rare': ['UR', 3], 'Shiny rare': ['S', 3],
    'Radiant Rare': ['K', 3], 'Amazing Rare': ['A', 3], 'Character Rare': ['CHR', 3],
    'Special illustration rare': [{ en: 'SIR', ja: 'SAR' }, 4], 'Hyper rare': ['HR', 4], 'Mega Hyper Rare': ['MUR', 4],
    'Shiny Ultra Rare': ['SSR', 4], 'Character Super Rare': ['CSR', 4], 'Secret Rare': ['SEC', 4],
  },
  onepiece: {
    'Common': ['C', 0], 'Uncommon': ['UC', 0], 'Rare': ['R', 1], 'Promo': ['P', 1], 'Leader': ['L', 2],
    'SuperRare': ['SR', 3], 'SecretRare': ['SEC', 4], 'Special': ['SP', 4], 'TreasureRare': ['TR', 4],
  },
};
function rarityInfo(game, r) {
  if (!r || r === 'None') return null;
  const [code, tier] = RARITY[game]?.[r] || [r.split(/\s+/).map(w => w[0]).join('').toUpperCase(), 1];
  return { code: typeof code === 'object' ? code[lang] : code, tier };
}

// Average copies of each rarity per pack (Pokémon) or per 24-pack box (ONE PIECE).
// Community pack-opening estimates (e.g. TCGplayer's 5,000+ pack samples), not official odds.
const ODDS = {
  pokemon: {
    unit: 'pack', applies: d => lang === 'en' && ['sv', 'me'].includes(d.series),
    per: { 'Common': 4, 'Uncommon': 3, 'Rare': 0.79, 'Double rare': 1 / 5, 'ACE SPEC Rare': 1 / 20,
      'Illustration rare': 1 / 11, 'Ultra Rare': 1 / 14, 'Special illustration rare': 1 / 90,
      'Hyper rare': 1 / 140, 'Mega Hyper Rare': 1 / 1260 },
  },
  onepiece: {
    unit: 'box', applies: d => /^(OP|EB|PRB)/.test(d.code),
    per: { 'SuperRare': 4, 'SecretRare': 1 / 3, 'Parallel': 1.5 },
  },
};
const oddsBucket = (game, c) => game === 'onepiece' && c.alt ? 'Parallel' : c.rarity;
function oddsFor(game, data, card) {
  const o = ODDS[game], k = oddsBucket(game, card);
  if (!o || !o.applies(data) || !o.per[k]) return null;
  const count = data.cards.filter(c => oddsBucket(game, c) === k).length;
  return { unit: o.unit, bucket: k, count, tierRate: o.per[k], cardRate: o.per[k] / count };
}
function oddsLines(game, o) {
  const fmt = n => (n >= 100 ? Math.round(n / 10) * 10 : n >= 10 ? Math.round(n) : Math.round(n * 10) / 10).toLocaleString(lang);
  const fill = tf;
  const r = o.bucket === 'Parallel' ? t('parallel') : rarityInfo(game, o.bucket)?.code || o.bucket;
  const box = o.unit === 'box';
  const main = box && o.cardRate >= 1 ? fill('oddsBoxMany', { n: fmt(o.cardRate) }) : fill(box ? 'oddsBox' : 'oddsPack', { n: fmt(1 / o.cardRate) });
  const tier = o.tierRate >= 1 ? fill(box ? 'tierBoxMany' : 'tierPackMany', { r, n: fmt(o.tierRate) })
    : fill(box ? 'tierBox' : 'tierPack', { r, n: fmt(1 / o.tierRate) });
  return { main, tier, share: fill('tierShare', { r, c: o.count }) };
}

// Cardmarket (EUR) price block from a TCGdex card; avg1/7/30 are average sold prices over the last 1/7/30 days
// Main figure is the median of trend / 7-day / 30-day / overall average, because a single field is
// sometimes broken (Base Set Charizard has trend €0.02 next to a €682 30-day average).
function cardmarketPrice(c) {
  const cm = c.pricing?.cardmarket;
  const vals = cm ? [cm.trend, cm.avg7, cm.avg30, cm.avg].filter(v => typeof v === 'number' && v > 0).sort((a, b) => a - b) : [];
  if (!vals.length) return null;
  const m = vals.length >> 1, main = vals.length % 2 ? vals[m] : (vals[m - 1] + vals[m]) / 2;
  return {
    source: 'Cardmarket', currency: 'EUR', updated: cm.updated, mainLabel: 'marketPrice', main,
    rows: [['trend', cm.trend], ['sold1', cm.avg1], ['sold7', cm.avg7], ['sold30', cm.avg30], ['lowListing', cm.low], ['reverseHolo', cm['trend-holo']]],
  };
}
const topByPrice = cards => cards.filter(c => c.price?.main > 0).sort((a, b) => b.price.main - a.price.main).slice(0, 3);

const GAMES = {
  pokemon: {
    icon: `<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="#fbfaf7"/><path d="M3 24a21 21 0 0 1 42 0z" fill="#e3350d"/><path d="M8 13.5a19 19 0 0 1 11-8" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="24" cy="24" r="21" fill="none" stroke="#222" stroke-width="3"/><path d="M3 24h13.5M31.5 24H45" stroke="#222" stroke-width="3"/><circle cx="24" cy="24" r="7" fill="#fbfaf7" stroke="#222" stroke-width="3"/><circle cx="24" cy="24" r="2.8" fill="#fbfaf7" stroke="#222" stroke-width="1.5"/></svg>`, name: { en: 'Pokémon', ja: 'ポケモン' }, desc: 'pokemonDesc',
    async sets() {
      const [list, pocket, dates, packs] = await Promise.all([
        getJSON(`https://api.tcgdex.net/v2/${TCGDEX[lang]}/sets`),
        // TCG Pocket is the digital mobile game, not physical cards
        getJSON(`https://api.tcgdex.net/v2/${TCGDEX[lang]}/series/tcgp`).then(r => r.sets.map(x => x.id)).catch(() => []),
        // The set list has no dates; GraphQL returns them all at once (English data only)
        lang !== 'en' ? {} : postGraphQL('https://api.tcgdex.net/v2/graphql', '{ sets { id releaseDate } }')
          .then(r => Object.fromEntries(r.data.sets.map(x => [x.id, x.releaseDate]))).catch(() => ({})),
        // Booster pack photos (TCGplayer), prebuilt by tools/build-pokemon-packs.js
        getJSON('pokemon-packs.json').then(j => j[lang] || {}).catch(() => ({})),
      ]);
      return list.filter(s => !pocket.includes(s.id)).reverse().map(s => ({
        id: s.id, code: s.id.toUpperCase(), name: s.name,
        logo: s.logo ? s.logo + '.webp' : (s.symbol ? s.symbol + '.webp' : null),
        total: s.cardCount?.total ?? 0, date: dates[s.id] || null,
        pack: packs[s.id]?.pack || packs[s.id]?.box || null,
      }));
    },
    async set(id) {
      const s = await getJSON(`https://api.tcgdex.net/v2/${TCGDEX[lang]}/sets/${encodeURIComponent(id)}`);
      const cards = (s.cards || []).map(c => ({
        id: c.id, num: c.localId, name: c.name,
        img: c.image ? c.image + '/low.webp' : null, imgHi: c.image ? c.image + '/high.webp' : null,
      }));
      // Missing images are filled in afterwards so a slow fallback never blocks the grid
      const later = [
        cards.some(c => !c.img) && ptcgImagesFor(s).then(alt => {
          cards.forEach(c => { const a = alt.get(c.id); if (!c.img && a) { c.img = a.small; c.imgHi = a.large; } });
          return alt.size > 0;
        }),
        tcgdexRarities(s).then(m => { cards.forEach(c => { c.rarity = m[c.id] || c.rarity; }); return true; }),
      ].filter(Boolean);
      return { name: s.name, code: s.id.toUpperCase(), series: s.serie?.id, releaseDate: s.releaseDate, cards, later };
    },
    // Prices only come one card at a time, so price the rarest cards (where the expensive ones are)
    // and remember the result for a day.
    async top(data, setId) {
      const key = `top:${lang}:${setId}`, cached = load(key, null);
      if (cached && Date.now() - cached.at < 24 * 3600 * 1000) {
        data.cards.forEach(c => { if (cached.prices[c.id]) c.price = cached.prices[c.id]; });
      } else {
        const tier = c => rarityInfo('pokemon', c.rarity)?.tier ?? -1;
        // rarest first; within a rarity keep set order (older sets put their holos first)
        const pool = data.cards.slice().sort((a, b) => tier(b) - tier(a) || data.cards.indexOf(a) - data.cards.indexOf(b)).slice(0, 40);
        await Promise.all(pool.map(c => getJSON(`https://api.tcgdex.net/v2/${TCGDEX[lang]}/cards/${encodeURIComponent(c.id)}`)
          .then(d => { const p = cardmarketPrice(d); if (p) c.price = p; }).catch(() => {})));
        save(key, { at: Date.now(), prices: Object.fromEntries(pool.filter(c => c.price).map(c => [c.id, c.price])) });
      }
      return topByPrice(data.cards);
    },
    // TCGdex matches names anywhere in the word; a card id is "<setId>-<number>"
    async searchCards(term, sets) {
      const list = await getJSON(`https://api.tcgdex.net/v2/${TCGDEX[lang]}/cards?name=${encodeURIComponent(term)}`);
      const byId = new Map(sets.map(s => [s.id, s]));
      return list.map(c => {
        const setId = c.id.slice(0, c.id.lastIndexOf('-')), s = byId.get(setId);   // drops TCG Pocket cards
        // newest sets may lack TCGdex images; reuse the backup images a set page already found (ptcgImagesFor)
        return s && { setId, setName: s.name, setCode: s.code, cardId: c.id, num: c.localId, name: c.name,
          img: c.image ? c.image + '/low.webp' : load('ptcg:' + setId, {})?.[c.id]?.small || null };
      }).filter(Boolean);
    },
    async detail(card) {
      const c = await getJSON(`https://api.tcgdex.net/v2/${TCGDEX[lang]}/cards/${encodeURIComponent(card.id)}`);
      const rows = [
        [t('set'), c.set?.name], [t('number'), `${c.localId}${c.set?.cardCount?.official ? ' / ' + c.set.cardCount.official : ''}`],
        [t('category'), c.category], [t('rarity'), c.rarity], [t('hp'), c.hp], [t('type'), c.types?.join(', ')],
        [t('illustrator'), c.illustrator],
      ];
      const texts = [];
      (c.abilities || []).forEach(a => texts.push(`◆ ${a.name}\n${a.effect || ''}`));
      (c.attacks || []).forEach(a => texts.push(`${(a.cost || []).map(x => '●').join('')} ${a.name}${a.damage ? '  ' + a.damage : ''}${a.effect ? '\n' + a.effect : ''}`));
      if (c.effect) texts.push(c.effect);
      if (c.description) texts.push(c.description);
      const prices = cardmarketPrice(c);
      const searchQ = `${c.name} ${c.localId}${c.set?.cardCount?.official ? '/' + c.set.cardCount.official : ''}`;
      // PSA 10 lookup goes through api/psa10.js so the API key stays off the page.
      // Set names there are English, so Japanese lookups rely on name + number only.
      const psa = { id: c.id, name: c.name, number: c.localId, set: lang === 'en' ? c.set?.name || '' : '', lang };
      return { name: c.name, rows, texts, prices, searchQ, psa };
    },
  },
  onepiece: {
    icon: `<svg viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="31" rx="21.5" ry="8.5" fill="#e9c46a" stroke="#8a6420" stroke-width="2"/><path d="M11.5 30.5C11.5 17 17 11 24 11s12.5 6 12.5 19.5c-7 3-18 3-25 0z" fill="#f2d385" stroke="#8a6420" stroke-width="2" stroke-linejoin="round"/><path d="M12 25.5c7.5 3 16.5 3 24 0l.4 5c-7.6 3-16.8 3-24.8 0z" fill="#d1392b"/><path d="M17 16.5l2.5 3M24 13.5v3.5M31 16.5l-2.5 3M6 31.5l3 1.2M42 31.5l-3 1.2M15 36.5l1.5 1.5M33 36.5l-1.5 1.5" stroke="#b8902e" stroke-width="1.4" stroke-linecap="round"/></svg>`, name: { en: 'ONE PIECE', ja: 'ワンピース' }, desc: 'onepieceDesc',
    async sets() {
      const [packs, official] = await Promise.all([getJSON(`${PUNK}/english/packs.json`), opOfficial()]);
      const { prefix } = PUNK_LANG[lang], tbl = official[lang] || {};
      const list = Object.values(packs).map(p => {
        const label = p.title_parts?.label || '', code = lang === 'ja' ? opJaCode(label) : label, o = code && tbl[code];
        const enName = p.title_parts?.title && `${p.title_parts.prefix ? p.title_parts.prefix + ' · ' : ''}${p.title_parts.title}`;
        return {
          id: prefix + p.id.slice(3), code, enCode: label, logo: null, total: null, date: o?.date || null,
          pack: opImg(o?.img, 240, true),
          // official "BOOSTER PACK -ROMANCE DAWN-" → "BOOSTER PACK · ROMANCE DAWN"
          name: o?.name?.replace(/\s*-(.+?)-?\s*$/, ' · $1').replace(/\s+/g, ' ') || enName || p.raw_title,
        };
      });
      if (lang === 'ja') Object.entries(OP_JP_EXTRA).forEach(([id, code]) =>
        list.push({ id, code, name: tbl[code]?.name || `Pack ${id}`, date: tbl[code]?.date || null, logo: null, total: null, pack: opImg(tbl[code]?.img, 240, true) }));
      const rank = s => /^OP/.test(s.code) ? 0 : /^(EB|PRB)/.test(s.code) ? 1 : /^ST/.test(s.code) ? 2 : 3;
      const norm = s => s.code.replace(/-/g, '');
      return list.sort((a, b) => rank(a) - rank(b) || norm(b).localeCompare(norm(a), undefined, { numeric: true }));
    },
    async set(id) {
      const [raw, sets] = await Promise.all([getJSON(`${PUNK}/${PUNK_LANG[lang].dir}/data/${id}.json`), this.sets()]);
      const meta = sets.find(s => s.id === id);
      const prefixes = [...new Set(raw.map(c => c.id.split('-')[0]))];
      const cards = raw.map(c => ({
        id: c.id, num: c.id.replace(/_p(\d+)$/, ''), name: c.name, alt: /_p\d+$/.test(c.id), rarity: c.rarity,
        img: opImg(c.img_full_url, 240), imgHi: opImg(c.img_full_url, 640), imgFull: opImg(c.img_full_url), raw: c,
      }));
      // TCGplayer market price via optcgapi (one request per set; ids match punk-records).
      // Only the English edition is priced, so Japanese cards borrow the English price, labelled as such.
      const later = [], enCode = meta?.enCode;
      if (enCode) later.push(
        getJSON(`https://optcgapi.com/api/${enCode.startsWith('ST') ? 'decks' : 'sets'}/${encodeURIComponent(enCode)}/`).then(list => {
          if (!Array.isArray(list)) return false;
          const byId = new Map(list.map(x => [x.card_image_id, x]));
          const source = lang === 'en' ? 'TCGplayer' : t('tcgEnEdition');
          cards.forEach(c => {
            const x = byId.get(c.id);
            if (x?.market_price != null) c.price = { source, currency: 'USD', updated: x.date_scraped, mainLabel: 'marketPrice', main: x.market_price, rows: [] };
          });
          return true;
        }));
      return { name: null, code: prefixes.join(' / '), releaseDate: meta?.date, cards, later };
    },
    // No search API exists, so search a prebuilt index of every card (tools/build-op-index.js), by name or number
    async searchCards(term, sets) {
      const idx = await getJSON(`op-cards-${lang}.json`);
      const byId = new Map(sets.map(s => [s.id, s])), q = term.toLowerCase(), out = [];
      for (const [id, name, pack, v] of idx.cards) {
        if (!name.toLowerCase().includes(q) && !id.toLowerCase().includes(q)) continue;
        const s = byId.get(pack); if (!s) continue;
        out.push({ setId: pack, setName: s.name, setCode: s.code, cardId: id, num: id.replace(/_p\d+$/, ''), name,
          alt: /_p\d+$/.test(id), img: opImg(idx.tpl.replace('{id}', id).replace('{v}', v), 240) });
      }
      return out;
    },
    async detail(card) {
      const c = card.raw;
      return {
        name: c.name,
        rows: [[t('number'), c.id.replace(/_p\d+$/, '')], [t('category'), c.category], [t('rarity'), c.rarity],
          [t('color'), c.colors?.join(' / ')], [t('cost'), c.cost], [t('power'), c.power], [t('counter'), c.counter],
          [t('attribute'), c.attributes?.join(' / ')], [t('traits'), c.types?.join(' / ')]],
        texts: [c.effect, c.trigger && `【Trigger】${c.trigger}`].filter(Boolean),
        prices: card.price || null,
        searchQ: `${c.name} ${card.num}${card.alt ? (lang === 'ja' ? ' パラレル' : ' Parallel') : ''}`,
      };
    },
  },
};

function parseHash() { return location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent); }

function renderHome() {

    <div class="games">${Object.entries(GAMES).map(([k, g]) => `

    </div><p class="note">${t('dataNote')}</p>`;

async function renderSets(gameKey) {
  const g = GAMES[gameKey], tok = ++renderToken; loading();
  let sets; try { sets = await g.sets(); } catch (e) { return failed(e); }
  if (tok !== renderToken) return;
  const owned = getOwned(gameKey);
  const ownedBySet = id => [...owned].filter(x => x.startsWith(id + '|')).length;
  app.innerHTML = `<div class="crumbs"><a href="#/">${t('home')}</a> ›</div>
    <h1 class="gtitle"><span class="gicon sm">${g.icon}</span>${esc(g.name[lang])}</h1><p class="sub">${sets.length} ${t('sets')}</p>
    <div class="toolbar"><input class="search" id="q" placeholder="${t('searchSetsCards')}" value="${esc(load('q:' + gameKey, ''))}"></div>
    <div class="sets" id="list"></div><section class="cardhits" id="hits" hidden></section>`;
  const list = document.getElementById('list'), q = document.getElementById('q'), hits = document.getElementById('hits');
  // Card names across every set: searched after a short pause in typing, newest sets first
  const order = new Map(sets.map((s, i) => [s.id, i]));
  let searchSeq = 0, searchTimer;
  const searchCards = term => {
    clearTimeout(searchTimer);
    const seq = ++searchSeq;
    if (term.length < 2) { hits.hidden = true; return; }
    hits.hidden = false; hits.innerHTML = `<h2>${t('cardsTitle')}</h2><p class="topwait">${t('searching')}</p>`;
    searchTimer = setTimeout(async () => {
      let found; try { found = await g.searchCards(term, sets); } catch { found = null; }
      if (seq !== searchSeq || tok !== renderToken) return;
      if (!found) { hits.innerHTML = `<h2>${t('cardsTitle')}</h2><p class="topwait">${t('error')}</p>`; return; }
      found.sort((a, b) => order.get(a.setId) - order.get(b.setId));
      const shown = found.slice(0, 60);
      hits.innerHTML = `<h2>${t('cardsTitle')} <span class="n">${found.length}</span></h2>${!found.length ? `<p class="topwait">${t('noCards')}</p>` : `
        <div class="cards">${shown.map(c => `<a class="card" href="#/${gameKey}/${encodeURIComponent(c.setId)}/${encodeURIComponent(c.cardId)}">
          <div class="img">${c.img ? `<img src="${esc(c.img)}" alt="${esc(c.name)}" loading="lazy" onerror="this.outerHTML='<div class=noimg>${t('noImage')}</div>'">` : `<div class="noimg">${esc(c.name)}<br>${t('noImage')}</div>`}</div>
          ${c.alt ? `<span class="badge">${t('parallel')}</span>` : ''}
          <div class="label"><b>${esc(c.num)}</b><span>${esc(c.name)}</span></div>
          <div class="inset">${esc(c.setCode ? `${c.setCode} · ${c.setName}` : c.setName)}</div></a>`).join('')}</div>
        ${found.length > shown.length ? `<p class="topwait">${tf('moreCards', { n: shown.length, m: found.length })}</p>` : ''}`}`;
    }, 300);
  };
  const draw = () => {
    const term = q.value.trim().toLowerCase(); save('q:' + gameKey, q.value);
    const shown = sets.filter(s => !term || `${s.code} ${s.name}`.toLowerCase().includes(term));
    searchCards(term);
    // with a search term, an empty set list just disappears and the card results take over
    list.innerHTML = shown.length ? shown.map(s => {
      const have = ownedBySet(s.id), pct = s.total ? Math.min(100, have / s.total * 100) : 0;
      return `<a class="set${s.pack ? ' has-pack' : ''}" href="#/${gameKey}/${encodeURIComponent(s.id)}">
        ${s.pack ? `<img class="packimg" src="${esc(s.pack)}" alt="" loading="lazy" onerror="this.parentNode.classList.remove('has-pack');this.remove()">` : ''}
        ${s.logo ? `<div class="logo"><img src="${esc(s.logo)}" alt="" loading="lazy" onerror="this.parentNode.remove()"></div>` : ''}
        ${s.code ? `<div class="code">${esc(s.code)}</div>` : ''}
        <div class="name">${esc(s.name)}</div>
        ${s.date ? `<div class="date${s.date > new Date().toISOString().slice(0, 10) ? ' soon' : ''}">${esc(fmtRelease(s.date))}</div>` : ''}
        <div class="meta">${s.total ? `${have} / ${s.total} ${t('cards')}` : have ? `${have} ${t('owned')}` : ''}</div>
        ${s.total ? `<div class="progress"><i style="width:${pct}%"></i></div>` : ''}</a>`;
    }).join('') : term.length >= 2 ? '' : `<div class="state">${t('noResults')}</div>`;
  };
  q.addEventListener('input', draw); draw();
}

async function renderSet(gameKey, setId, openCardId) {
  const g = GAMES[gameKey], tok = ++renderToken; loading();
  let data, setMeta;
  try { [data, setMeta] = await Promise.all([g.set(setId), g.sets().then(l => l.find(s => s.id === setId)).catch(() => null)]); }
  catch (e) { return failed(e); }
  if (tok !== renderToken) return;
  const title = data.name || setMeta?.name || setId, code = setMeta?.code || data.code;
  const key = c => `${setId}|${c.id}`;
  let filter = 'all', rarFilter = null;
  app.innerHTML = `<div class="crumbs"><a href="#/">${t('home')}</a> › <a href="#/${gameKey}">${esc(g.name[lang])}</a> ›</div>
    <div class="sethead">${setMeta?.pack ? `<img class="packhero" src="${esc(setMeta.pack)}" alt="" onerror="this.remove()">` : ''}
      <div><h1>${esc(title)}</h1><p class="sub">${[code, `${data.cards.length} ${t('cards')}`, fmtRelease(data.releaseDate || setMeta?.date)].filter(Boolean).map(esc).join(' · ')}</p></div></div>
    <div class="simrow" id="simrow" hidden></div>
    <section class="top" id="top" aria-label="${t('topTitle')}"><h2>${t('topTitle')}</h2><p class="topwait">${t('topLoading')}</p></section>
    <div class="toolbar">
      <input class="search" id="q" placeholder="${t('searchCards')}">
      ${['all', 'owned', 'missing'].map(f => `<button class="chip" data-f="${f}" aria-pressed="${f === filter}">${t(f)}</button>`).join('')}
      <span class="stat" id="stat"></span>
    </div><div class="rchips" id="rars"></div><div class="cards" id="grid"></div>`;
  const grid = document.getElementById('grid'), q = document.getElementById('q'), stat = document.getElementById('stat');
  const rars = document.getElementById('rars');
  const drawRarities = () => {
    const counts = {};
    data.cards.forEach(c => { if (rarityInfo(gameKey, c.rarity)) counts[c.rarity] = (counts[c.rarity] || 0) + 1; });
    const list = Object.keys(counts).sort((a, b) => rarityInfo(gameKey, a).tier - rarityInfo(gameKey, b).tier || counts[b] - counts[a]);
    rars.innerHTML = list.length < 2 ? '' : `<button class="chip" data-r="" aria-pressed="${!rarFilter}">${t('rarityAll')}</button>` +
      list.map(r => { const ri = rarityInfo(gameKey, r);
        return `<button class="chip" data-r="${esc(r)}" aria-pressed="${r === rarFilter}" title="${esc(r)}"><i class="dot t${ri.tier}"></i>${esc(ri.code)}<span class="n">${counts[r]}</span></button>`; }).join('');
  };
  rars.addEventListener('click', e => {
    const b = e.target.closest('[data-r]'); if (!b) return;
    rarFilter = b.dataset.r || null; draw();
  });
  const draw = () => {
    drawRarities();
    const owned = getOwned(gameKey), term = q.value.trim().toLowerCase();
    const have = data.cards.filter(c => owned.has(key(c))).length;
    stat.textContent = `${have} / ${data.cards.length} ${t('collected')}`;
    const shown = data.cards.filter(c => (!term || `${c.num} ${c.name}`.toLowerCase().includes(term))
      && (filter === 'all' || (filter === 'owned') === owned.has(key(c))) && (!rarFilter || c.rarity === rarFilter));
    grid.innerHTML = shown.length ? shown.map(c => {
      const o = owned.has(key(c)), i = data.cards.indexOf(c), ri = rarityInfo(gameKey, c.rarity);
      return `<div class="card ${o ? 'have' : ''}" data-i="${i}" role="button" tabindex="0">
        <div class="img">${c.img ? `<img src="${esc(c.img)}" alt="${esc(c.name)}" loading="lazy" onerror="this.outerHTML='<div class=noimg>${t('noImage')}</div>'">`
          : `<div class="noimg">${esc(c.name)}<br>${t('noImage')}</div>`}
          ${ri ? `<span class="rar t${ri.tier}" title="${esc(c.rarity)}">${esc(ri.code)}</span>` : ''}
          ${c.price ? `<span class="price">${esc(fmtMoney(c.price.main, c.price.currency))}</span>` : ''}</div>
        ${c.alt ? `<span class="badge">${t('parallel')}</span>` : ''}
        <button class="own" data-own="${i}" aria-pressed="${o}" aria-label="${t('markOwned')}">✓</button>
        <div class="label"><b>${esc(c.num)}</b><span>${esc(c.name)}</span></div></div>`;
    }).join('') : `<div class="state">${t('noResults')}</div>`;
  };
  q.addEventListener('input', draw);
  app.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    filter = b.dataset.f; app.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b)); draw();
  }));
  grid.addEventListener('click', e => {
    const own = e.target.closest('[data-own]');
    if (own) { toggleOwned(gameKey, key(data.cards[own.dataset.own])); return draw(); }
    const card = e.target.closest('.card');
    if (card) openDetail(g, gameKey, data, data.cards[card.dataset.i], key(data.cards[card.dataset.i]), draw);
  });
  grid.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('card')) e.target.click(); });
  draw();
  (data.later || []).forEach(p => p.then(changed => { if (changed && tok === renderToken) draw(); }).catch(() => {}));

  // Arrived from a card search result (#/game/set/card): open that card, and drop it from the
  // address once closed so the back button and reloads land on the set
  const linked = openCardId && data.cards.find(c => c.id === openCardId);
  if (linked) {
    document.querySelector(`.card[data-i="${data.cards.indexOf(linked)}"]`)?.scrollIntoView({ block: 'center' });
    openDetail(g, gameKey, data, linked, key(linked), draw);
    const setHash = `#/${gameKey}/${encodeURIComponent(setId)}`;
    modal.addEventListener('close', () => {
      if (location.hash.startsWith(setHash + '/')) history.replaceState(null, '', setHash);   // not if we've already moved on
    }, { once: true });
  }

  // Pack simulator (packsim.js): offered once rarities are known, for sets sold in booster packs
  Promise.allSettled(data.later || []).then(() => {
    if (tok === renderToken) window.mountPackSim?.({ g, gameKey, data, setId, setMeta, key });
  });

  // Most valuable: ranked once prices (and, for Pokémon, rarities) have arrived
  const top = document.getElementById('top');
  Promise.allSettled(data.later || [])
    .then(() => g.top ? g.top(data, setId) : topByPrice(data.cards))
    .catch(() => [])
    .then(list => {
      if (tok !== renderToken) return;
      if (!list.length) { top.hidden = true; return; }
      top.innerHTML = `<h2>${t('topTitle')}</h2><div class="toprow">${list.map((c, n) => {
        const ri = rarityInfo(gameKey, c.rarity);
        return `<button class="tcard" data-i="${data.cards.indexOf(c)}">
          <span class="timg">${c.img ? `<img src="${esc(c.img)}" alt="">` : ''}<span class="rank">${n + 1}</span></span>
          <span class="tinfo"><b>${esc(c.name)}</b>
            <small>${esc(c.num)}${ri ? ` · ${esc(ri.code)}` : ''}${c.alt ? ` · ${t('parallel')}` : ''}</small>
            <strong>${esc(fmtMoney(c.price.main, c.price.currency))}</strong></span></button>`;
      }).join('')}</div><p class="topnote">${esc(list[0].price.source)}</p>`;
      draw();   // newly priced cards get their price tag in the grid too
    });
  top.addEventListener('click', e => {
    const b = e.target.closest('.tcard'); if (!b) return;
    const c = data.cards[b.dataset.i]; openDetail(g, gameKey, data, c, key(c), draw);
  });
}

modal.addEventListener('click', e => { if (e.target === modal) modal.close(); });
async function loadPsa10(q) {
  const slot = modal.querySelector('#psa10'), text = modal.querySelector('#psatext');
  if (!slot) return;
  slot.innerHTML = `<small>${t('loading')}</small>`;
  let r; try { r = await getJSON('api/psa10?' + new URLSearchParams(q)); } catch { r = { ok: false, reason: 'error' }; }
  if (!slot.isConnected) return;
  if (r.ok && (r.avg ?? r.median ?? r.market) != null) {
    const main = r.market ?? r.avg ?? r.median;
    const rows = [['psaAvg', r.avg], ['psaMedian', r.median]].filter(([, v]) => v != null && v !== main);
    const trend = { up: ['psaUp', '▲'], down: ['psaDown', '▼'], stable: ['psaStable', '▶'] }[r.trend];
    slot.innerHTML = `${r.market != null ? `<small>${t('psaMarket')}</small>` : ''}
      <strong>${esc(fmtMoney(main, r.currency))}${trend ? ` <em class="trend ${r.trend}">${trend[1]} ${t(trend[0])}</em>` : ''}</strong>
      ${rows.map(([k, v]) => `<div class="prow"><span>${t(k)}</span><b>${esc(fmtMoney(v, r.currency))}</b></div>`).join('')}
      ${r.sales != null ? `<div class="prow"><span>${t('psaSales')}</span><b>${esc(r.sales)}</b></div>` : ''}
      ${r.lastSale ? `<div class="prow"><span>${t('psaLast')}</span><b>${esc(fmtDate(r.lastSale))}</b></div>` : ''}
      <small>${esc(tf('priceFrom', { s: 'Pokémon Price Tracker (eBay)', d: fmtDate(r.updated) || '—' }))}</small>`;
    text.textContent = t('psaLinks');
  } else {
    // no key configured → keep the plain explanation; otherwise say why there's no number
    slot.innerHTML = r.reason === 'no-key' ? '' : `<small>${t(I18N.en['psa_' + r.reason] ? 'psa_' + r.reason : 'psa_error')}</small>`;
  }
}

// ---------- full-screen zoom viewer ----------
// Shows the detail image at once, swaps in the full-size original when it arrives (ONE PIECE),
// and zooms toward the cursor / pinch point: wheel, pinch, double-click/tap, +/− keys or buttons.
const viewer = document.getElementById('viewer');
const vs = { s: 1, x: 0, y: 0, pts: new Map(), pinch: null, moved: false, lastTap: 0 };
const MIN_Z = 1, MAX_Z = 6;
function vApply() {
  const img = viewer.querySelector('.vimg');
  if (img) img.style.transform = `translate(${vs.x}px, ${vs.y}px) scale(${vs.s})`;
  const z = viewer.querySelector('.vzoom'); if (z) z.textContent = `${Math.round(vs.s * 100)}%`;
  viewer.classList.toggle('zoomed', vs.s > 1);
}
// keep the image point under (px, py) fixed while changing scale; px/py are relative to the stage centre
function vZoomAt(next, px = 0, py = 0) {
  next = Math.min(MAX_Z, Math.max(MIN_Z, next));
  vs.x = px - (px - vs.x) * next / vs.s; vs.y = py - (py - vs.y) * next / vs.s; vs.s = next;
  if (vs.s === 1) vs.x = vs.y = 0;
  vApply();
}
function vPoint(e) {
  const r = viewer.querySelector('.vstage').getBoundingClientRect();
  return [e.clientX - r.left - r.width / 2, e.clientY - r.top - r.height / 2];
}
function openViewer(src, full, name) {
  Object.assign(vs, { s: 1, x: 0, y: 0, pinch: null }); vs.pts.clear();
  viewer.innerHTML = `<div class="vstage"><img class="vimg" src="${esc(src)}" alt="${esc(name)}" draggable="false"></div>
    <div class="vbar">
      <button data-v="out" aria-label="${t('zoomOut')}">−</button><span class="vzoom">100%</span>
      <button data-v="in" aria-label="${t('zoomIn')}">+</button><button data-v="fit">${t('zoomFit')}</button>
      <button data-v="close" aria-label="${t('close')}">×</button>
    </div>
    <p class="vhint">${t(matchMedia('(pointer: coarse)').matches ? 'zoomHintTouch' : 'zoomHint')}${full && full !== src ? `<span class="vfull"> · ${t('fullLoading')}</span>` : ''}</p>`;
  viewer.showModal(); vApply();
  if (full && full !== src) {
    const hi = new Image();
    hi.onload = () => { const img = viewer.querySelector('.vimg'); if (img && viewer.open) img.src = full; viewer.querySelector('.vfull')?.remove(); };
    hi.onerror = () => viewer.querySelector('.vfull')?.remove();
    hi.src = full;
  }
}
viewer.addEventListener('click', e => {
  const b = e.target.closest('[data-v]');
  if (b) return { in: () => vZoomAt(vs.s * 1.5), out: () => vZoomAt(vs.s / 1.5), fit: () => vZoomAt(1), close: () => viewer.close() }[b.dataset.v]();
  // a plain click on the dark background closes it (not after a drag, not while zoomed)
  if (e.target.classList.contains('vstage') && !vs.moved && vs.s === 1) viewer.close();
});
viewer.addEventListener('wheel', e => {
  if (!e.target.closest('.vstage')) return;
  e.preventDefault(); vZoomAt(vs.s * Math.exp(-e.deltaY * 0.0015), ...vPoint(e));
}, { passive: false });
viewer.addEventListener('keydown', e => {
  if (e.key === '+' || e.key === '=') vZoomAt(vs.s * 1.5);
  else if (e.key === '-') vZoomAt(vs.s / 1.5);
  else if (e.key === '0') vZoomAt(1);
});
viewer.addEventListener('pointerdown', e => {
  if (!e.target.closest('.vstage')) return;
  e.target.setPointerCapture?.(e.pointerId);
  vs.pts.set(e.pointerId, [e.clientX, e.clientY]); vs.moved = false;
  if (vs.pts.size === 2) {
    const [a, b] = [...vs.pts.values()];
    vs.pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), s: vs.s };
  }
});
viewer.addEventListener('pointermove', e => {
  const prev = vs.pts.get(e.pointerId); if (!prev) return;
  vs.pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (vs.pts.size === 2 && vs.pinch) {
    const [a, b] = [...vs.pts.values()];
    const mid = vPoint({ clientX: (a[0] + b[0]) / 2, clientY: (a[1] + b[1]) / 2 });
    vZoomAt(vs.pinch.s * Math.hypot(a[0] - b[0], a[1] - b[1]) / vs.pinch.d, ...mid); vs.moved = true;
  } else if (vs.pts.size === 1 && vs.s > 1) {
    vs.x += e.clientX - prev[0]; vs.y += e.clientY - prev[1]; vs.moved = true; vApply();
  }
});
const vUp = e => {
  if (!vs.pts.delete(e.pointerId)) return;
  if (vs.pts.size < 2) vs.pinch = null;
  // double-tap / double-click toggles between fit and 2.5×
  if (e.type === 'pointerup' && !vs.moved && e.target.closest('.vimg')) {
    const now = Date.now();
    if (now - vs.lastTap < 300) { vZoomAt(vs.s > 1 ? 1 : 2.5, ...vPoint(e)); vs.lastTap = 0; } else vs.lastTap = now;
  }
};
viewer.addEventListener('pointerup', vUp);
viewer.addEventListener('pointercancel', vUp);

async function openDetail(g, gameKey, data, card, ownKey, onChange) {
  modal.innerHTML = `<div class="state"><div class="spin"></div>${t('loading')}</div>`; modal.showModal();
  let d; try { d = await g.detail(card); } catch (e) { modal.innerHTML = `<div class="state">${t('error')}</div>`; return; }
  const o = oddsFor(gameKey, data, card), ol = o && oddsLines(gameKey, o);
  const odds = ol ? `<div class="odds"><span>${t('odds')}</span><strong>${esc(ol.main)}</strong>${esc(ol.tier)}<br>${esc(ol.share)}<small>${t('oddsNote')}</small></div>`
    : gameKey === 'onepiece' && /^ST/.test(data.code) ? `<div class="odds"><strong>${t('inDeck')}</strong></div>` : '';
  // PSA 10: no free graded-price feed, so link to sold/completed listings for this exact card
  const psaQ = encodeURIComponent(`${d.searchQ} PSA 10`);
  const psa = d.searchQ ? `<div class="pricebox"><span>${t('psaTitle')}</span><div id="psa10"></div><small id="psatext" style="margin:4px 0 8px">${t('psaText')}</small>
      <div class="links">
        <a class="btn" target="_blank" rel="noopener noreferrer" href="https://www.ebay.com/sch/i.html?_nkw=${psaQ}&LH_Sold=1&LH_Complete=1&_sop=13">${t('ebaySold')} ↗</a>
        <a class="btn" target="_blank" rel="noopener noreferrer" href="https://jp.mercari.com/search?keyword=${psaQ}&status=sold_out&sort=created_time&order=desc">${t('mercariSold')} ↗</a>
      </div></div>` : '';
  const p = d.prices;
  const price = p ? `<div class="pricebox"><span>${t(p.mainLabel)}</span><strong>${esc(fmtMoney(p.main, p.currency))}</strong>
      ${p.rows.filter(r => r[1]).map(([k, v]) => `<div class="prow"><span>${t(k)}</span><b>${esc(fmtMoney(v, p.currency))}</b></div>`).join('')}
      <small>${esc(tf('priceFrom', { s: p.source, d: fmtDate(p.updated) }))}<br>${t('priceNote')}</small></div>`
    : `<div class="pricebox"><small>${t(gameKey === 'onepiece' && lang === 'ja' ? 'noPriceJa' : 'noPrice')}</small></div>`;
  const btn = () => getOwned(gameKey).has(ownKey) ? `<button class="btn on" id="ob">${t('isOwned')}</button>` : `<button class="btn" id="ob">${t('markOwned')}</button>`;
  modal.innerHTML = `<button class="close" aria-label="Close" onclick="this.closest('dialog').close()">×</button>
    <div class="detail">
      <div>${card.imgHi ? `<button class="zoomable" id="zoomopen" aria-label="${t('viewFull')}">
          <img src="${esc(card.imgHi)}" alt="${esc(d.name)}"><span class="zoomhint">⤢ ${t('viewFull')}</span></button>`
        : `<div class="state">${t('noImage')}</div>`}</div>
      <div><h2>${esc(d.name)}</h2>
        <dl>${d.rows.filter(r => r[1] != null && r[1] !== '').map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
        ${price}${psa}${odds}
        ${d.texts.map(x => `<div class="effect">${esc(x)}</div>`).join('')}
        <p id="obw">${btn()}</p>
        <a class="reportcard" target="_blank" rel="noopener" href="${esc(issueUrl('bug_report', {
          title: `[Bug] ${d.name} (${card.num})`, page: location.href, card: `${card.num} ${d.name} [${card.id}]`,
          game: gameField(gameKey), browser: browserField() }))}">🐞 ${t('reportCard')}</a>
      </div></div>`;
  if (d.psa) loadPsa10(d.psa);
  modal.querySelector('#zoomopen')?.addEventListener('click', () => openViewer(card.imgHi, card.imgFull, d.name));
  modal.querySelector('#obw').addEventListener('click', e => {
    if (e.target.id !== 'ob') return; toggleOwned(gameKey, ownKey);
    modal.querySelector('#obw').innerHTML = btn(); onChange();
  });
}

function route() {
  chrome(); viewer.open && viewer.close(); modal.open && modal.close(); window.scrollTo(0, 0);
  const [game, set, card] = parseHash();
  if (!GAMES[game]) return renderHome();
  if (!set) return renderSets(game);
  renderSet(game, set, card);
}
window.addEventListener('hashchange', route);
route();
</script>
